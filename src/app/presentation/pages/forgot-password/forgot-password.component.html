<div class="container">
  <div class="card animate-in">
    <div class="header">
      <h1>Recuperar senha 🔑</h1>
      <p class="subtitle">Informe seu e-mail para receber o link de redefinição</p>
    </div>

    <form [formGroup]="form" (ngSubmit)="submit()">
      <div class="field">
        <label for="email">E-mail</label>
        <input
          id="email"
          type="email"
          formControlName="email"
          placeholder="m@example.com"
        />
        <small class="error" *ngIf="form.get('email')?.invalid && form.get('email')?.touched">
          Informe um e-mail válido
        </small>
      </div>

      <button
        type="submit"
        class="btn-primary"
        [disabled]="loading || form.invalid"
      >
        <span *ngIf="!loading">Enviar link</span>
        <span *ngIf="loading" class="loader">
          <span class="spinner"></span>
          Enviando...
        </span>
      </button>

      <p class="success" *ngIf="successMessage">{{ successMessage }}</p>
      <p class="error" *ngIf="errorMessage">{{ errorMessage }}</p>
    </form>

    <div class="links">
      <a routerLink="/login">Voltar para login</a>
    </div>
  </div>
</div>
