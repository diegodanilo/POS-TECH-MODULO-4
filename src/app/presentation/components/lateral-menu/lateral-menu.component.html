<ul class="lateralMenu" nz-menu nzMode="vertical">
  <li
    nz-menu-item
    *ngFor="let item of menuItems"
    [nzMatchRouter]="true"
    (click)="onMenuClick(item)"
  >
    <span>{{ item.label }}</span>
  </li>
</ul>
